name: Publish up to five quality guides daily
on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'America/Vancouver'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: editorial-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Draft and validate up to five distinct articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/publish.py
      - name: Commit approved articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs editorial-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated affiliate education guides"
            git push
          fi
